<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mature Anime Crossover Battle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d13;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            background: #161622;
            border: 3px solid #ff3e3e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.3);
            text-align: center;
        }
        .screen-alert {
            color: #ff3e3e;
            font-weight: bold;
            font-size: 1.5rem;
            text-transform: uppercase;
            margin: 15px 0;
            height: 30px;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #222235;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .btn {
            background: #ff3e3e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #ff1f1f;
            box-shadow: 0 0 10px rgba(255, 31, 31, 0.5);
        }
        .btn-shop { background: #b53eff; }
        .btn-shop:hover { background: #9c1fff; }
        
        /* Mobile Touch Controls Layout */
        #mobile-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>ANIME SHOWDOWN (18+)</h1>
        <p style="color: #888;">System Status: Highly Efficient Web Control Pipeline Active</p>
        
        <hr style="border-color: #333;">

        <div id="instructions-guide" style="color: #ffd700; font-size: 0.9rem; margin: 10px 0;">
            INSTRUCTION: Follow the guide. Kill enemies to unlock ultimate powers.
        </div>

        <div id="announcer-screen" class="screen-alert">--- READY TO FIGHT ---</div>

        <div class="stats-box">
            <div>Coins: <span id="coin-count" style="color: #00ffcc; font-weight: bold;">0</span> / 10000</div>
            <div>Current Killstreak: <span id="kill-streak" style="color: #ff3e3e;">0</span></div>
        </div>

        <h3>[ Combat Actions ]</h3>
        <button class="btn" onclick="killEnemy(false, false)">Standard Kill</button>
        <button class="btn" onclick="killEnemy(true, false)">Revenge Kill</button>
        <button class="btn" onclick="killEnemy(false, true)">Humiliation Kill</button>

        <br><br>
        <h3>[ Match Outcomes ]</h3>
        <button class="btn" onclick="completeLevel(true)">Win Level (+100 Coins)</button>
        <button class="btn" onclick="completeLevel(false)">Defeated Level (+200 Coins)</button>

        <br><br>
        <h3>[ Character Roster Shop ]</h3>
        <button class="btn btn-shop" onclick="buyCharacter('Gojo (Jujutsu Style)')">Unlock Gojo (10,000 Coins)</button>
        <button class="btn btn-shop" onclick="buyCharacter('Naruto (Sage Mode)')">Unlock Naruto (10,000 Coins)</button>
    </div>

    <audio id="snd-killing-spree" src="audio/killingspree.mp3" preload="auto"></audio>
    <audio id="snd-revenge" src="audio/revenge.mp3" preload="auto"></audio>
    <audio id="snd-humiliation" src="audio/humiliation.mp3" preload="auto"></audio>
    <audio id="snd-win" src="audio/victory.mp3" preload="auto"></audio>
    <audio id="snd-lose" src="audio/defeat.mp3" preload="auto"></audio>
    <audio id="snd-guide" src="audio/guide_intro.mp3" preload="auto"></audio>

    <script>
        // --- GAME STATE ---
        let gameData = {
            coins: 0,
            killCount: 0,
            characterCost: 10000
        };

        // Web Audio API setup for immediate, high-efficiency play latency reduction
        const audioElements = {
            killingSpree: document.getElementById('snd-killing-spree'),
            revenge: document.getElementById('snd-revenge'),
            humiliation: document.getElementById('snd-humiliation'),
            win: document.getElementById('snd-win'),
            lose: document.getElementById('snd-lose'),
            guide: document.getElementById('snd-guide')
        };

        // --- CORE LOGIC FUNCTIONS ---

        // Play Sound cleanly over the web browser
        function playSound(audioNode) {
            if (audioNode) {
                audioNode.currentTime = 0; // Rewind to start
                audioNode.play().catch(e => console.log("Audio waiting for user click interaction."));
            }
        }

        // Display alerts visually on screen 
        function updateAnnouncer(message, color = "#ff3e3e") {
            const display = document.getElementById('announcer-screen');
            display.textContent = message;
            display.style.color = color;
        }

        // 1. Kill Tracker & Grading Logic
        function killEnemy(isRevenge, isHumiliation) {
            gameData.killCount++;
            document.getElementById('kill-streak').textContent = gameData.killCount;

            if (isHumiliation) {
                updateAnnouncer("💥 HUMILIATION! 💥", "#ff00ff");
                playSound(audioElements.humiliation);
            } else if (isRevenge) {
                updateAnnouncer("💀 REVENGE! 💀", "#ff3e3e");
                playSound(audioElements.revenge);
            } else if (gameData.killCount >= 3) {
                updateAnnouncer("🔥 KILLING SPREE! 🔥", "#ffcc00");
                playSound(audioElements.killingSpree);
            } else {
                updateAnnouncer(`Enemy Slain! (${gameData.killCount})`, "#ffffff");
            }
        }

        // 2. Level System Economy Rules
        function completeLevel(playerWon) {
            if (playerWon) {
                gameData.coins += 100;
                updateAnnouncer("🏆 LEVEL VICTORY! +100 COINS", "#00ffcc");
                playSound(audioElements.win);
                checkGiftBox();
            } else {
                // Your custom rule: Defeat awards 200 coins to help them keep trying
                gameData.coins += 200;
                updateAnnouncer("❌ DEFEATED! GRANTED +200 COINS", "#ff3e3e");
                playSound(audioElements.lose);
            }
            
            // Reset streak for next battle round
            gameData.killCount = 0;
            document.getElementById('kill-streak').textContent = gameData.killCount;
            document.getElementById('coin-count').textContent = gameData.coins;
        }

        // 3. Loot / Special Gift Box Drops
        function checkGiftBox() {
            let chance = Math.floor(Math.random() * 100);
            if (chance <= 35) { // 35% chance
                setTimeout(() => {
                    alert("🎁 SPECIAL GIFT BOX OPENED!\nYou found: Free Anime Death-Note Equipment!");
                }, 500);
            }
        }

        // 4. Shop Verification System
        function buyCharacter(characterName) {
            if (gameData.coins >= gameData.characterCost) {
                gameData.coins -= gameData.characterCost;
                document.getElementById('coin-count').textContent = gameData.coins;
                alert(`SUCCESS! You unlocked the 18+ Special Hero: ${characterName}`);
            } else {
                let missing = gameData.characterCost - gameData.coins;
                alert(`INSUFFICIENT COINS!\nYou need ${missing} more coins to purchase this 10,000 cost character.`);
            }
        }

        // Initialize voice instruction guide upon initial page focus/click
        window.addEventListener('click', () => {
            if(audioElements.guide.paused && gameData.coins === 0) {
                playSound(audioElements.guide);
                document.getElementById('instructions-guide').textContent = "GUIDE: Target locked. Defeat them cleanly.";
            }
        }, { once: true });

    </script>
</body>
</html>
