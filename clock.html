<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multi TimeZone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .subtitle {
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #10b981;
            background: transparent;
            color: #10b981;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #10b981;
            color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .btn.active {
            background: #10b981;
            color: #1a1a2e;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(16, 185, 129, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .clock-card:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.2);
            transform: translateY(-5px);
        }

        .timezone-name {
            color: #10b981;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .timezone-label {
            color: #cbd5e0;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .digital-time {
            font-size: 2.5rem;
            color: #10b981;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .analog-clock {
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            border: 3px solid #10b981;
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .clock-center {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 50px;
            background: #10b981;
            margin-left: -3px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .minute-hand {
            width: 4px;
            height: 65px;
            background: #64b5f6;
            margin-left: -2px;
            box-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
        }

        .second-hand {
            width: 2px;
            height: 75px;
            background: #ef5350;
            margin-left: -1px;
            box-shadow: 0 0 8px rgba(239, 83, 80, 0.5);
        }

        .time-format-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .format-btn {
            padding: 8px 16px;
            border: 2px solid #64b5f6;
            background: transparent;
            color: #64b5f6;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .format-btn.active {
            background: #64b5f6;
            color: #1a1a2e;
        }

        .add-timezone {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #10b981;
            background: rgba(0, 0, 0, 0.3);
            color: #10b981;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        select option {
            background: #1a1a2e;
            color: #10b981;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .stat-box {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 15px;
            color: #10b981;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef5350;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.3s;
        }

        .clock-card:hover .remove-btn {
            opacity: 1;
        }

        .remove-btn:hover {
            background: #d32f2f;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 40px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 World Clock</h1>
            <p class="subtitle">Track time across multiple time zones</p>
        </div>

        <div class="time-format-toggle">
            <button class="format-btn active" onclick="toggleFormat('12h')">12-Hour</button>
            <button class="format-btn" onclick="toggleFormat('24h')">24-Hour</button>
        </div>

        <div class="add-timezone">
            <select id="timezoneSelect" onchange="addTimezoneFromSelect()">
                <option value="">+ Add Timezone</option>
            </select>
        </div>

        <div id="clocksContainer" class="clocks-grid"></div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Total Timezones</div>
                <div class="stat-value" id="timezoneCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Current UTC Offset</div>
                <div class="stat-value" id="utcOffset">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Earliest Time</div>
                <div class="stat-value" id="earliestTime">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Latest Time</div>
                <div class="stat-value" id="latestTime">—</div>
            </div>
        </div>
    </div>

    <script>
        const TIMEZONES = [
            { name: 'New York', zone: 'America/New_York' },
            { name: 'Los Angeles', zone: 'America/Los_Angeles' },
            { name: 'London', zone: 'Europe/London' },
            { name: 'Paris', zone: 'Europe/Paris' },
            { name: 'Tokyo', zone: 'Asia/Tokyo' },
            { name: 'Sydney', zone: 'Australia/Sydney' },
            { name: 'Dubai', zone: 'Asia/Dubai' },
            { name: 'Singapore', zone: 'Asia/Singapore' },
            { name: 'Hong Kong', zone: 'Asia/Hong_Kong' },
            { name: 'Mumbai', zone: 'Asia/Kolkata' },
            { name: 'Bangkok', zone: 'Asia/Bangkok' },
            { name: 'Moscow', zone: 'Europe/Moscow' },
            { name: 'Berlin', zone: 'Europe/Berlin' },
            { name: 'Toronto', zone: 'America/Toronto' },
            { name: 'Mexico City', zone: 'America/Mexico_City' },
            { name: 'São Paulo', zone: 'America/Sao_Paulo' },
            { name: 'Cairo', zone: 'Africa/Cairo' },
            { name: 'Istanbul', zone: 'Europe/Istanbul' },
            { name: 'Bangkok', zone: 'Asia/Bangkok' },
            { name: 'UTC', zone: 'UTC' }
        ];

        let selectedTimezones = [
            { name: 'New York', zone: 'America/New_York' },
            { name: 'London', zone: 'Europe/London' },
            { name: 'Tokyo', zone: 'Asia/Tokyo' }
        ];

        let is24HourFormat = false;

        function initializeApp() {
            populateTimezoneSelect();
            updateClocks();
            setInterval(updateClocks, 1000);
        }

        function populateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            select.innerHTML = '<option value="">+ Add Timezone</option>';
            TIMEZONES.forEach((tz, index) => {
                const alreadySelected = selectedTimezones.some(st => st.zone === tz.zone);
                if (!alreadySelected) {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = tz.name;
                    select.appendChild(option);
                }
            });
        }

        function addTimezoneFromSelect() {
            const select = document.getElementById('timezoneSelect');
            const index = parseInt(select.value);
            if (isNaN(index)) return;

            const tz = TIMEZONES[index];
            const alreadyExists = selectedTimezones.some(st => st.zone === tz.zone);
            if (!alreadyExists) {
                selectedTimezones.push(tz);
            }

            select.value = '';
            updateClocks();
            populateTimezoneSelect();
        }

        function removeTimezone(zone) {
            selectedTimezones = selectedTimezones.filter(tz => tz.zone !== zone);
            updateClocks();
            populateTimezoneSelect();
        }

        function getTimeInZone(zone) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: zone,
                hour: is24HourFormat ? '2-digit' : '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: !is24HourFormat
            });

            return formatter.format(new Date());
        }

        function getAnalogTimeInZone(zone) {
            const date = new Date();
            const utcTime = date.getTime() + date.getTimezoneOffset() * 60000;
            const zoneTime = new Date(utcTime + getTimezoneOffset(zone) * 3600000);
            return zoneTime;
        }

        function getTimezoneOffset(zone) {
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: zone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(new Date());
            const zoneDate = new Date();
            zoneDate.setUTCHours(
                parseInt(parts.find(p => p.type === 'hour').value),
                parseInt(parts.find(p => p.type === 'minute').value),
                parseInt(parts.find(p => p.type === 'second').value)
            );

            return (zoneDate - new Date()) / 3600000;
        }

        function updateClocks() {
            const container = document.getElementById('clocksContainer');

            if (selectedTimezones.length === 0) {
                container.innerHTML = '<div class="empty-state">No timezones selected. Add one to get started!</div>';
                updateStats();
                return;
            }

            container.innerHTML = selectedTimezones.map(tz => {
                const time = getTimeInZone(tz.zone);
                const analogTime = getAnalogTimeInZone(tz.zone);
                const hours = analogTime.getHours() % 12;
                const minutes = analogTime.getMinutes();
                const seconds = analogTime.getSeconds();

                const hourDegrees = (hours * 30) + (minutes * 0.5);
                const minuteDegrees = (minutes * 6) + (seconds * 0.1);
                const secondDegrees = seconds * 6;

                return `
                    <div class="clock-card">
                        <button class="remove-btn" onclick="removeTimezone('${tz.zone}')">×</button>
                        <div class="timezone-name">${tz.name}</div>
                        <div class="timezone-label">${tz.zone}</div>
                        <div class="digital-time">${time}</div>
                        <div class="analog-clock">
                            <div class="hand hour-hand" style="transform: rotate(${hourDegrees}deg);"></div>
                            <div class="hand minute-hand" style="transform: rotate(${minuteDegrees}deg);"></div>
                            <div class="hand second-hand" style="transform: rotate(${secondDegrees}deg);"></div>
                            <div class="clock-center"></div>
                        </div>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        function updateStats() {
            document.getElementById('timezoneCount').textContent = selectedTimezones.length;

            if (selectedTimezones.length === 0) {
                document.getElementById('utcOffset').textContent = '—';
                document.getElementById('earliestTime').textContent = '—';
                document.getElementById('latestTime').textContent = '—';
                return;
            }

            const localOffset = -new Date().getTimezoneOffset() / 60;
            document.getElementById('utcOffset').textContent = `UTC${localOffset >= 0 ? '+' : ''}${localOffset}`;

            const times = selectedTimezones.map(tz => {
                const analogTime = getAnalogTimeInZone(tz.zone);
                return analogTime.getHours() * 60 + analogTime.getMinutes();
            });

            const earliestIdx = times.indexOf(Math.min(...times));
            const latestIdx = times.indexOf(Math.max(...times));

            document.getElementById('earliestTime').textContent = `${selectedTimezones[earliestIdx].name}: ${getTimeInZone(selectedTimezones[earliestIdx].zone)}`;
            document.getElementById('latestTime').textContent = `${selectedTimezones[latestIdx].name}: ${getTimeInZone(selectedTimezones[latestIdx].zone)}`;
        }

        function toggleFormat(format) {
            is24HourFormat = format === '24h';
            document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateClocks();
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
